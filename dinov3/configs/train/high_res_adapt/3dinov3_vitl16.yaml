MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32
compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 131072
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 4096
  koleo_loss_weight: 0.1
  koleo_loss_distributed: true
  koleo_topk: 1
  koleo_distributed_replicas: 0
  koleo_distributed_loss_group_size: 32
  force_weight_norm: false
  reweight_dino_local_loss: true
  local_loss_weight_schedule:
    start: 0.5
    peak: 0.5
    end: 0.5
    warmup_epochs: 0
    cosine_epochs: 0
  koleo_distributed_loss_group_data: true
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 49152
  head_bottleneck_dim: 192
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 4096
gram:
  use_loss: true
  compute_stats: false
  loss_weight: 1.0
  ema_teacher: false
  it_load_ema_teacher: -1
  rep_update: false
  update_frequency: 250
  it_first_update: 250
  max_updates: 3
  normalized: true
  img_level: true
  remove_neg: false
  remove_only_teacher_neg: false
  tokens_used: all
  global_teacher_resize_method: trilinear
  global_teacher_resize_antialias: false
  loss_weight_schedule:
    start: 1.5
    peak: 1.5
    end: 1.5
    warmup_epochs: 0
    cosine_epochs: 0
train:
  batch_size_per_gpu: 16
  dataset_path: null
  saveckp_freq: 20
  seed: 0
  num_workers: 2
  OFFICIAL_EPOCH_LENGTH: 100
  monitor_gradient_norm: false
  chunk_schedule: []
  cache_dataset: true
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  checkpointing: true
  checkpointing_full: true
  compile: true
  cudagraphs: false
  cell_augmentation: false
  cell_augmentation_type: hpa
  sharded_eval_checkpoint: false
student:
  arch: vit_large
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  patch_drop: 0.0
  pretrained_weights: ''
  ffn_layer: mlp
  ffn_ratio: 4
  resume_from_teacher_chkpt: ''
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernormbf16
  n_storage_tokens: 4
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: false
  mask_k_bias: true
  in_chans: 1
  pos_embed_type: rope
  pos_embed_rope_base: 100
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: 2
  pos_embed_rope_dtype: fp32
  fp8_enabled: false
  fp8_filter: blocks
teacher:
  momentum_teacher: null
  final_momentum_teacher: null
  warmup_teacher_temp: null
  teacher_temp: null
  warmup_teacher_temp_epochs: null
  in_chans: 1
distillation:
  enabled: false
  full_cfg_path: ''
  checkpoint_path: ''
multidistillation:
  enabled: false
hrft:
  enabled: false
  checkpoint_path: ''
optim:
  epochs: 10
  optimizer: adamw
  weight_decay: null
  weight_decay_end: null
  lr: null
  warmup_epochs: null
  min_lr: null
  schedule_trunc_extra: null
  clip_grad: 30.0
  freeze_last_layer_epochs: null
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.98
  multi_tensor_optim: true
  dump_fsdp_weights_path: ''
  adamw_beta1: 0.9
  adamw_beta2: 0.99
crops:
  global_crops_inner_slice_scale:
  - 0.48
  - 1.0
  global_crops_cross_slice_scale:
  - 0.5
  - 1.0
  local_crops_number: 8
  local_crops_inner_slice_scale:
  - 0.16  # 1/10th edge length for in-slice
  - 0.48  # ~1/2 edge length for in-slice
  local_crops_cross_slice_scale:
  - 0.2  # 1/10th edge length for cross-slice
  - 0.5  # 1/2 edge length for cross-slice
  global_crops_size:
  - 112
  - 128
  - 256
  - 256
  - 256
  local_crops_size:
  - 64
  - 64
  - 96
  - 112
  - 128
  global_local_crop_pairs_ratios:
  - 0.3
  - 0.3
  - 0.3
  - 0.05
  - 0.05
  gram_teacher_crops_size:
  - 168
  - 192
  - 384
  - 384
  - 384
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  flips_3d: true
  gram_teacher_no_distortions: true
checkpointing:
  period: 100
  max_to_keep: 3
schedules:
  lr:
    start: 0
    peak: 0
    end: 1.25e-05
    warmup_epochs: 0
    freeze_last_layer_epochs: 0
    cosine_epochs: 5
  weight_decay:
    start: 0.04
    peak: 0.04
    end: 0.04
    warmup_epochs: 0
  teacher_temp:
    start: 0.07
    peak: 0.07
    end: 0.07
    warmup_epochs: 0
  momentum:
    start: 0.999
    peak: 0.999
    end: 0.999
    warmup_epochs: 0
